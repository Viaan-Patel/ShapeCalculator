<!DOCTYPE html>
<html>
<head>
<title>Session 20</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</head>
<body>
<div class="card text-bg-dark">
  <img src="https://cdn.pixabay.com/photo/2016/11/21/06/53/beautiful-natural-image-1844362_1280.jpg" class="card-img" alt="">
  <div class="card-img-overlay d-flex flex-column justify-content-center align-items-center">
    <h1 class="display-4">Shape Calculator</h1>
    <p class="lead">Calculate area and perimeters of each geometric shape</p>
  </div>
</div>

<!-- form -->
<div class="container my-5">
<div class="row">
<div class="col-lg-8 mx-auto">
<div class="card shadow">
<div class="card-body">
<div class="mb-3 row">
<label class="col-md-3 col-form-label">Select Shape</label>
<div class="col-md-9">
<select id="shape" class="form-select" onchange="changeLabels()">
<option value="rectangle">Rectangle</option>
<option value="triangle">Triangle</option>
<option value="circle">Circle</option>
</select>
</div>
</div>
<div class="mb-3 row">
<label id="label1" class="col-form-label col-md-3">Length</label>
<div class="col-md-9">
<input type="number" class="form-control" id="num1">
</div>
</div>

<div class="mb-3 row">
<label id="label2" class="col-form-label col-md-3">Width</label>
<div class="col-md-9">
<input type="number" class="form-control" id="num2">
</div>
</div>
<button class="btn btn-primary" onclick="calculator()">Calculate</button>
</div>
</div>

<div class="card shadow my-5">
<div class="card-body">
<h2>Result</h2>
<h4 id="area"></h4>
<h4 id="perimeter"></h4>
</div>
</div>

</div>
</div>
</div>

<script>

function rectangleArea(length,width){
return length*width;
}
function rectanglePerimeter(length,width){
    return 2*(length + width);
}

function circleArea(radius){
    return Math.PI*radius*radius;
}
function circlePerimeter(radius){
return 2*Math.PI*radius;
}

function triangleArea(base,height){
return 0.5*base*height;
}
<!-- assuming equilateral triangle -->
function trianglePerimeter(side){
return 3*side;
}


function changeLabels(){
    let shape = document.getElementById("shape").value;

    let label1 = document.getElementById("label1");
    let label2 = document.getElementById("label2");
    let input2 = document.getElementById("num2");
    
    if(shape=="rectangle"){
        label1.innerHTML = "Length";
        label2.innerHTML = "Breadth";
        input2.disabled = false;
    }

    else if(shape=="circle"){
        label1.innerHTML = "Radius";
        label2.innerHTML = "Not Required";
        input2.disabled = true;
        input2.value = "";
    }

    else{
        label1.innerHTML = "Base";
        label2.innerHTML = "Height";
        input2.disabled = false;
    }
}


function calculator(){
    let shape = document.getElementById("shape").value;

    let num1 = parseFloat(document.getElementById("num1").value);
    let num2 = parseFloat(document.getElementById("num2").value);
    let area, perimeter;

    if(shape=="rectangle"){
        if (isNaN(num1) || isNaN(num2)) {
         alert("Please enter valid values.");
         return;
        }

        area = rectangleArea(num1,num2);
        perimeter = rectanglePerimeter(num1,num2);
    }

    // for circle
    else if(shape=="circle"){
        if (isNaN(num1)) {
            alert("Please enter the radius.");
            return;
        }

        area = circleArea(num1);
        perimeter = circlePerimeter(num1);
    }

<!-- fortriangle -->
else{
    if (isNaN(num1) || isNaN(num2)) {
            alert("Please enter valid values.");
            return;
        }

        area = triangleArea(num1,num2);
        perimeter = trianglePerimeter(num1);
}
<!-- displaying result -->
document.getElementById("area").innerHTML = "Area: "+ area.toFixed(2);

document.getElementById("perimeter").innerHTML = "Perimeter"+ perimeter.toFixed(2);

}
changeLabels()

</script>
</body>
</html>
